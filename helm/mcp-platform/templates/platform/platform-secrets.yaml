apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: {{ .Values.platform.namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.platform.secrets.postgresPassword | default "gateway_db_password_change_me" | b64enc | quote }}
  GATEWAY_DATA_KEY: {{ .Values.platform.secrets.dataKey | default "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=" | b64enc | quote }}
  SEED_ADMIN_PASSWORD: {{ .Values.platform.secrets.seedAdminPassword | default "admin_password_change_me" | b64enc | quote }}
  SEED_MEMBER_PASSWORD: {{ .Values.platform.secrets.seedMemberPassword | default "member_password_change_me" | b64enc | quote }}
  LLM_BASE_URL: {{ .Values.platform.secrets.llmBaseUrl | default "https://api.openai.com/v1" | b64enc | quote }}
  LLM_API_KEY: {{ .Values.platform.secrets.llmApiKey | default "" | b64enc | quote }}
  LLM_MODEL: {{ .Values.platform.secrets.llmModel | default "gpt-4o-mini" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-secrets
  namespace: {{ .Values.platform.namespace }}
type: Opaque
data:
  WC_BASE_URL: {{ printf "http://wordpress.%s.svc.cluster.local" .Values.store.namespace | b64enc | quote }}
  WC_CONSUMER_KEY: {{ .Values.store.secrets.wcConsumerKey | default "ck_dev_change_me" | b64enc | quote }}
  WC_CONSUMER_SECRET: {{ .Values.store.secrets.wcConsumerSecret | default "cs_dev_change_me" | b64enc | quote }}
