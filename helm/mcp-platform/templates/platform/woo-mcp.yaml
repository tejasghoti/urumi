apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  namespace: {{ .Values.platform.namespace }}
  labels:
    app: woo-mcp
spec:
  replicas: {{ .Values.platform.wooMcp.replicas }}
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: woo-mcp
          image: {{ .Values.platform.wooMcp.image }}
          imagePullPolicy: {{ .Values.platform.wooMcp.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: WC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: woo-mcp-secrets
                  key: WC_BASE_URL
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woo-mcp-secrets
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woo-mcp-secrets
                  key: WC_CONSUMER_SECRET
          resources:
            {{- toYaml .Values.platform.wooMcp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  namespace: {{ .Values.platform.namespace }}
  labels:
    app: woo-mcp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: woo-mcp
