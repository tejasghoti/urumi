apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-store-ingress
  namespace: {{ .Values.store.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-ingress
  namespace: {{ .Values.store.namespace }}
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress
        - podSelector:
            matchLabels:
              app: store-bootstrap
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-ingress
  namespace: {{ .Values.store.namespace }}
spec:
  podSelector:
    matchLabels:
      app: wordpress
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.platform.namespace }}
          podSelector:
            matchLabels:
              app: woo-mcp
        - podSelector:
            matchLabels:
              app: store-bootstrap
      ports:
        - protocol: TCP
          port: 80
