apiVersion: v1
kind: Secret
metadata:
  name: store-db
  namespace: {{ .Values.store.namespace }}
type: Opaque
data:
  MARIADB_ROOT_PASSWORD: {{ .Values.store.secrets.mariadbRootPassword | default "root_dev_password_change_me" | b64enc | quote }}
  MARIADB_PASSWORD: {{ .Values.store.secrets.mariadbPassword | default "wp_dev_password_change_me" | b64enc | quote }}
  MARIADB_DATABASE: {{ "wordpress" | b64enc | quote }}
  MARIADB_USER: {{ "wp" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-wp
  namespace: {{ .Values.store.namespace }}
type: Opaque
data:
  WORDPRESS_DB_HOST: {{ printf "mariadb.%s.svc.cluster.local:3306" .Values.store.namespace | b64enc | quote }}
  WORDPRESS_DB_NAME: {{ "wordpress" | b64enc | quote }}
  WORDPRESS_DB_USER: {{ "wp" | b64enc | quote }}
  WORDPRESS_DB_PASSWORD: {{ .Values.store.secrets.mariadbPassword | default "wp_dev_password_change_me" | b64enc | quote }}
  WORDPRESS_ADMIN_USER: {{ .Values.store.secrets.wpAdminUser | default "admin" | b64enc | quote }}
  WORDPRESS_ADMIN_PASSWORD: {{ .Values.store.secrets.wpAdminPassword | default "wp_admin_password_change_me" | b64enc | quote }}
  WORDPRESS_ADMIN_EMAIL: {{ .Values.store.secrets.wpAdminEmail | default "admin@store.local" | b64enc | quote }}
  WC_CONSUMER_KEY: {{ .Values.store.secrets.wcConsumerKey | default "ck_dev_change_me" | b64enc | quote }}
  WC_CONSUMER_SECRET: {{ .Values.store.secrets.wcConsumerSecret | default "cs_dev_change_me" | b64enc | quote }}
