apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-ingress
  namespace: {{ .Values.store.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.store.ingressClassName }}
spec:
  ingressClassName: {{ .Values.store.ingressClassName }}
  rules:
    - host: {{ .Values.store.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
